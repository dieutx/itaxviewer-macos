name: Đề xuất tính năng
description: Đề xuất cải thiện trải nghiệm hoặc khả năng của ứng dụng.
title: "[Tính năng] "
labels:
  - tính năng
body:
  - type: markdown
    attributes:
      value: |
        Hãy mô tả nhu cầu thay vì chỉ mô tả giải pháp. Ứng dụng phải tiếp tục xử lý hồ sơ ngoại tuyến và không thu thập dữ liệu.

  - type: textarea
    id: need
    attributes:
      label: Nhu cầu hoặc vấn đề
      description: Bạn đang cố làm gì và gặp trở ngại nào?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Giải pháp đề xuất
      description: Mô tả luồng sử dụng mong muốn; có thể nêu phương án thay thế.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Phạm vi
      options:
        - Trải nghiệm người dùng
        - Hiển thị biểu mẫu
        - In / xuất PDF
        - Khả năng truy cập
        - Hiệu năng
        - Công cụ phát triển / CI
        - Tài liệu
        - Khác
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Nguồn tham khảo công khai (không bắt buộc)
      description: Chỉ dẫn link công khai; không tải lên tài sản vendor hoặc hồ sơ thuế.

  - type: checkboxes
    id: constraints
    attributes:
      label: Xác nhận
      options:
        - label: Đề xuất này không yêu cầu tải hồ sơ lên mạng, telemetry, analytics hoặc cloud processing.
          required: true
        - label: Tôi không gửi dữ liệu người nộp thuế hoặc tài sản lấy từ bộ cài iTax Viewer gốc.
          required: true
