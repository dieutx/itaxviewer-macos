name: macOS build and tests
run-name: ${{ inputs.request_id != '' && format('Windows build {0}', inputs.request_id) || format('macOS build {0}', github.sha) }}

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional identifier used by the Windows build helper
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Public repository safety check
        run: python3 .github/scripts/check_public_safety.py

      - name: Unit tests
        working-directory: iTaxViewerMac
        run: swift test

      - name: Field-mapping harness
        run: |
          python3 iTaxViewerMac/scripts/validate_fixtures.py
          python3 docs/reverse-engineering/tools/test_extract_xslt_specs.py

      - name: Bundled sample integration tests
        working-directory: iTaxViewerMac
        env:
          ITAX_FIXTURE_DIR: ../test-data
        run: |
          python3 scripts/validate_directory.py ../test-data
          swift test --filter ExternalFixturesTests

      - name: Build universal .app
        working-directory: iTaxViewerMac
        run: |
          chmod +x scripts/build_app.sh
          scripts/build_app.sh --universal --dmg

      - name: Launch the native app bundle
        working-directory: iTaxViewerMac
        run: bash scripts/run_app_qa.sh

      - name: Native WebKit print and PDF smoke checks
        working-directory: iTaxViewerMac
        timeout-minutes: 4
        run: python3 scripts/run_native_qa.py

      - name: Upload native QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iTaxViewerMac-native-qa
          path: iTaxViewerMac/build/native-qa/
          if-no-files-found: warn

      # upload-artifact does not preserve executable permissions or symlinks.
      # Keep the .app inside a macOS-created archive for a runnable download.
      - name: Package app and record build provenance
        working-directory: iTaxViewerMac
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/iTaxViewerMac.app build/iTaxViewerMac-universal.zip
          {
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            xcodebuild -version
            swift --version
            lipo -archs build/iTaxViewerMac.app/Contents/MacOS/iTaxViewerMac
            codesign --verify --deep --strict --verbose=2 build/iTaxViewerMac.app
            echo "Ad-hoc signed; not notarized. Native UI, print, and PDF parity require manual verification."
          } > build/BUILD-INFO.txt 2>&1
          cd build
          shasum -a 256 iTaxViewerMac-universal.zip iTaxViewerMac-unsigned.dmg > SHA256SUMS.txt

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: iTaxViewerMac-universal
          path: |
            iTaxViewerMac/build/iTaxViewerMac-universal.zip
            iTaxViewerMac/build/iTaxViewerMac-unsigned.dmg
            iTaxViewerMac/build/BUILD-INFO.txt
            iTaxViewerMac/build/SHA256SUMS.txt
          if-no-files-found: error

  intel-validation:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Intel toolchain and architecture
        run: |
          test "$(uname -m)" = x86_64
          xcodebuild -version
          swift --version

      - name: Intel unit tests
        working-directory: iTaxViewerMac
        run: swift test

      - name: Download the universal app built on arm64
        uses: actions/download-artifact@v8
        with:
          name: iTaxViewerMac-universal
          path: iTaxViewerMac/build

      - name: Verify and unpack the same distributed binary
        working-directory: iTaxViewerMac/build
        run: |
          shasum -a 256 -c SHA256SUMS.txt
          ditto -x -k iTaxViewerMac-universal.zip .
          codesign --verify --deep --strict --verbose=2 iTaxViewerMac.app
          lipo iTaxViewerMac.app/Contents/MacOS/iTaxViewerMac -verify_arch arm64 x86_64

      - name: Launch universal app and open all safe fixtures on Intel
        working-directory: iTaxViewerMac
        run: bash scripts/run_app_qa.sh

      - name: Intel native print and PDF checks
        working-directory: iTaxViewerMac
        timeout-minutes: 4
        run: python3 scripts/run_native_qa.py

      - name: Upload Intel QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iTaxViewerMac-native-qa-intel
          path: iTaxViewerMac/build/native-qa/
          if-no-files-found: warn
